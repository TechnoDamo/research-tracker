title: Research Tracker
description: A concise, source-grounded archive of research developments.
url: ""
baseurl: "/research-tracker"
markdown: kramdown
permalink: pretty
layouts_dir: web/_layouts
data_dir: web/_data
plugins:
  - jekyll-relative-links
exclude:
  - README.md
  - AGENTS.md
  - docs
  - templates
defaults:
  - scope:
      path: "topics"
      type: pages
    values:
      layout: default
