title: Research Tracker
description: An open record of how research develops across chosen topics.
url: "https://technodamo.github.io"
baseurl: "/research-tracker"
github_url: "https://github.com/TechnoDamo/research-tracker"
markdown: kramdown
permalink: pretty
layouts_dir: web/_layouts
data_dir: web/_data
plugins:
  - jekyll-relative-links
exclude:
  - README.md
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - docs
  - templates
  - scripts
  - "topics/*/monitoring.yml"
defaults:
  - scope:
      path: "topics"
      type: pages
    values:
      layout: default
